name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        config: [Debug, Release]
        arch: [x64, Win32]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake
      run: |
        cmake -B Build -A ${{ matrix.arch }}

    - name: Build
      run: |
        cmake --build Build --config ${{ matrix.config }}

    - name: Test
      working-directory: Build
      run: |
        ctest -C ${{ matrix.config }} --output-on-failure --verbose

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake
      run: |
        cmake -B Build -G Xcode -DARCANA_TESTS=OFF

    # Commented out until tests are re-enabled
    # - name: Build
    #   run: |
    #     cmake --build Build --config ${{ matrix.config }}
    #
    # - name: Test
    #   working-directory: Build
    #   run: |
    #     ctest -C ${{ matrix.config }} --output-on-failure --verbose

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        config: [Debug, Release]
        platform: [iphoneos, iphonesimulator]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake for iOS
      run: |
        cmake -B Build -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
          -DCMAKE_IOS_INSTALL_COMBINED=YES \
          -DARCANA_TESTS=OFF

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        config: [Debug, Release]
        compiler: [gcc-11, clang-14]
        include:
          - compiler: gcc-11
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11
          - compiler: clang-14
            cc: clang-14
            cxx: clang++-14
            # clang-14 ships the clang++-14 binary; there is no clang++-14 package
            packages: clang-14

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - name: Configure CMake
      run: |
        cmake -B Build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DARCANA_TESTS=OFF

    # Commented out until tests are re-enabled
    # - name: Build
    #   run: |
    #     cmake --build Build --config ${{ matrix.config }}
    #
    # - name: Test
    #   working-directory: Build
    #   run: |
    #     ctest -C ${{ matrix.config }} --output-on-failure --verbose

  ci-complete:
    name: ci-complete
    # Single aggregate check for branch protection to require, so the 14
    # matrix-generated check names stay free to change.
    #
    # `if: always()` is load-bearing: without it this job is skipped whenever a
    # dependency fails, and a skipped required check satisfies the requirement --
    # inverting the gate. The step below then asserts every result is success, so
    # failed, cancelled and skipped dependencies all fail the gate.
    if: always()
    needs: [windows, macos, ios, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Verify all jobs succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then
            echo "::error::CI did not succeed (results: $RESULTS)"
            exit 1
          fi
        done
